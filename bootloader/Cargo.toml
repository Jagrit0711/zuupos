[package]
name = "zuupos-boot"
version.workspace = true
edition.workspace = true

[[bin]]
name = "zuupos-boot"
path = "src/main.rs"

[dependencies]
uefi = { version = "0.33", features = ["alloc", "logger", "panic_handler"] }
uefi-services = "0.24"
log = "0.4"

[profile.dev]
panic = "abort"
opt-level = 2

[profile.release]
panic = "abort"
