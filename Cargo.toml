[workspace]
resolver = "2"
members = [
    "bootloader",
    "kernel",
    "agentd",
    "shell",
    "sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ZuuposOS Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zuupos/zuupos"

[workspace.dependencies]
x86_64 = "0.15"
acpi = "6.1.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
panic = "abort"
