[workspace]
resolver = "2"
members = [
    "bootloader",
    "kernel",
    "agentd",
    "shell",
    "sdk",
    "userspace/hello",
]

[workspace.package]
version = "0.5.2"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
panic = "abort"
