[workspace]
resolver = "2"
members = [
    "bootloader",
    "kernel",
    "agentd",
    "shell",
    "sdk",
    "userspace/hello",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
authors = ["ZuuposOS Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zuupos/zuupos"

[workspace.dependencies]
x86_64 = { version = "0.15", features = ["abi_x86_interrupt", "instructions"] }
bitflags = { version = "2", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
panic = "abort"
