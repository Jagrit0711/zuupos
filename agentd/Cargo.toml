[package]
name = "zuupos-agentd"
version.workspace = true
edition.workspace = true

[[bin]]
name = "zuupos-agentd"
path = "src/main.rs"

[dependencies]
# LLM inference — pure Rust (HuggingFace candle framework)
candle-core = { version = "0.8", default-features = false, features = [] }
candle-nn = { version = "0.8", default-features = false }
candle-transformers = { version = "0.8", default-features = false }

# Tokenizer
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Structured agent tool calls
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# For voice I/O (whisper.cpp + TTS)
# whisper-rs = "0.12"   # uncomment when whisper.cpp FFI is set up

async-trait = "0.1"
lazy_static = "1"
