[package]
name = "zuupos-agentd"
version.workspace = true
edition.workspace = true

[[bin]]
name = "zuupos-agentd"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Structured agent tool calls
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log = "0.4"
env_logger = "0.11"

async-trait = "0.1"

# Ollama HTTP client
reqwest = { version = "0.12", features = ["json"] }

# System metrics — CPU, memory, battery, processes
sysinfo = "0.31"

# Time and scheduling
chrono = { version = "0.4", features = ["clock"] }

# Persistent memory store (SQLite)
rusqlite = { version = "0.31", features = ["bundled"] }

# Random number generation for planner variance
rand = "0.8"

[features]
default = ["ollama"]
ollama = []
llama_cpp = []
