[package]
name = "zuupos-shell"
version.workspace = true
edition.workspace = true

[[bin]]
name = "zuupos-shell"
path = "src/main.rs"

[dependencies]
# Software framebuffer (no GPU needed — pure CPU pixel rendering)
softbuffer = "0.4"
winit = "0.29"

# GPU-accelerated 2D (future)
# wgpu = "22"

# Animation / easing
# keyframe = "1"

# Font rendering
fontdue = "0.9"
cosmic-text = "0.12"

# Image loading for avatar sprites
image = { version = "0.25", default-features = false, features = ["png", "webp"] }

# IPC with agentd
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

log = "0.4"
env_logger = "0.11"
