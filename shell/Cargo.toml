[package]
name = "zuupos-shell"
version.workspace = true
edition.workspace = true

[[bin]]
name = "zuupos-shell"
path = "src/main.rs"

[dependencies]
# Windowing — use 0.29 which uses ApplicationHandler trait
winit = { version = "0.29", features = ["rwh_05"] }
# Software framebuffer — pixel-perfect CPU rendering
softbuffer = "0.4"
# Font rendering — no_std compatible, pure Rust
fontdue = "0.9"
# Async for IPC with agentd
tokio = { version = "1", features = ["full"] }
# IPC protocol
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Time
chrono = { version = "0.4", features = ["clock"] }
# Logging
log = "0.4"
env_logger = "0.11"
# Rand (for particle effects)
rand = "0.8"
