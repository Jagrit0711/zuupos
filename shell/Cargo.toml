[package]
name = "zuupos-shell"
version.workspace = true
edition.workspace = true

[lib]
name = "zuupos_shell"
path = "src/lib.rs"

[[bin]]
name = "zuupos-shell"
path = "src/main.rs"

[dependencies]
# Windowing — use 0.30 with new ApplicationHandler API
winit = { version = "0.30", features = ["rwh_05"] }
# Software framebuffer — pixel-perfect CPU rendering
softbuffer = "0.4"
# Font rendering — no_std compatible, pure Rust
fontdue = "0.9"
# IPC protocol
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Time
chrono = { version = "0.4", features = ["clock"] }
# Logging
log = "0.4"
env_logger = "0.11"
# Rand (for particle effects and roaming)
rand = { version = "0.8", features = ["small_rng"] }
# Image decoding for visual gallery cards
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Fast HTTP client for Ollama LLM queries in background worker
reqwest = { version = "0.12", features = ["json", "blocking"] }

[dev-dependencies]

