[package]
name = "zuupos-kernel"
version.workspace = true
edition.workspace = true

[lib]
name = "zuupos_kernel"
path = "src/lib.rs"

[[bin]]
name = "zuupos-kernel"
path = "src/main.rs"

[dependencies]
# For logging (no_std compatible)
log = { version = "0.4", default-features = false }
# Bare-metal abstractions (0.15 with bitflags 2.x no_std)
x86_64 = { version = "0.15", features = ["abi_x86_interrupt", "instructions"] }
# bitflags 2.x with no_std (disable std feature)
bitflags = { version = "2", default-features = false }
# Spinning mutex (no OS needed)
spinning_top = "0.3"
# Bitmap allocator for page frames
linked_list_allocator = "0.10"
# UART serial
uart_16550 = "0.3"
# For volatile reads/writes
volatile = "0.4"
# For lazy initialization
conquer-once = { version = "0.4", default-features = false }
# Interrupt handling
pic8259 = "0.11"
lazy_static = { version = "1", features = ["spin_no_std"] }

[features]
default = []
# Enable QEMU test runner exit
qemu-exit = []
